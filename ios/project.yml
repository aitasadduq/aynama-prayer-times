name: Aynama

# The Xcode project is generated, not committed (see .gitignore). A .pbxproj is a merge-conflict
# generator and reviewing one is impossible; this file is the reviewable source of truth.
#
#   brew install xcodegen && cd ios && xcodegen generate

options:
  bundleIdPrefix: com.aynama
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The domain is compiled once, in SharedLogic, and every target links it. Strict concurrency
    # is on so a value that crosses from the widget extension into the domain has to say so.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SharedLogic:
    path: SharedLogic

targets:
  Aynama:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SharedLogic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aynama.prayertimes
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Everything else that belongs in the Info.plist is under `info.properties` below, NOT
        # as INFOPLIST_KEY_* settings here. Those apply only when Xcode generates the plist
        # itself; this target supplies one, so they are silently dropped — the app then runs
        # letterboxed in compatibility mode for want of a launch screen, and the missing
        # location string is a hard crash the first time a GPS profile asks for a fix.
      configs:
        Debug:
          # No paid team is configured, so simulator builds sign ad-hoc. Device builds need a
          # DEVELOPMENT_TEAM set above.
          #
          # The App Group declared below does NOT take effect here. An App Group is scoped to a
          # team identifier, and ad-hoc signing has none, so the entitlement is dropped and
          # AynamaStore falls back to its app-private container with the warning it logs. That
          # is fine for the app alone and is exactly what blocks testing the widget extension
          # against real shared profiles — the first thing that needs a DEVELOPMENT_TEAM.
          CODE_SIGNING_ALLOWED: NO
    info:
      path: App/Info.plist
      properties:
        UIAppFonts:
          - Fraunces.ttf
          - IBMPlexSans.ttf
        # Without a launch screen the app is given a compatibility-mode canvas smaller than the
        # device, which letterboxes every surface: the FAB lands on the ribbon's time column and
        # the page dots land in the middle of it.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # DESIGN.md §3: warm ink and linen parchment in both themes, following the system
        # setting. Automatic is the default; stated so nothing later assumes otherwise.
        UIUserInterfaceStyle: Automatic
        NSLocationWhenInUseUsageDescription: >-
          Aynama uses your location to calculate prayer times and the direction of the Kaaba.
          It stays on your device and is never sent anywhere.
        # The app's own scheme, `aynama://profile/<id>` (SharedLogic/AynamaURL.swift). A widget
        # tap, a Live Activity and a prayer notification all open the app on their own profile
        # by this URL, and iOS routes none of them to an app that has not declared the scheme.
        CFBundleURLTypes:
          - CFBundleURLName: com.aynama.prayertimes
            CFBundleURLSchemes:
              - aynama
    # The widget extension reads the profiles the app writes, which needs a shared container.
    # Generated from here for the same reason the Info.plist is: it is reviewable as yml and a
    # merge-conflict generator as a plist.
    entitlements:
      path: App/Aynama.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aynama.prayertimes

# There is no iOS unit-test target yet, deliberately. Everything in the app that can be tested
# without a screen — the countdown rule, the ribbon states, Friday naming, the Hijri offset, the
# deep-link format — lives in SharedLogic and is tested by `swift test`, which needs no simulator
# and runs in milliseconds. A target here would carry only what genuinely needs a running app,
# and that is blocked on the toolchain (see ios/scripts/typecheck-simulator.sh). Add it with the
# first XCUITest.

schemes:
  Aynama:
    build:
      targets:
        Aynama: all
    run:
      config: Debug
