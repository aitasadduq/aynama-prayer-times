name: Android

on:
  # The mobile workflow calls this on every change, alongside iOS.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint and APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The old "tools" package in this action's default was removed upstream.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shared test vectors
        working-directory: .
        run: |
          python3 -m pip install --quiet jsonschema
          python3 scripts/validate-vectors.py

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests (shared logic, phone and Wear OS)
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          :shared-logic:testDebugUnitTest :app:testDebugUnitTest :wear:testDebugUnitTest

      - name: Lint all Android modules
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          :shared-logic:lintDebug :app:lintDebug :wear:lintDebug

      - name: Build debug, R8 release and test APKs
        run: >-
          ./gradlew --no-daemon --stacktrace --max-workers=2
          :app:assembleDebug :wear:assembleDebug
          :app:assembleRelease :wear:assembleRelease
          :app:assembleDebugAndroidTest :shared-logic:assembleDebugAndroidTest
          :wear:assembleDebugAndroidTest

      - name: Upload reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          retention-days: 14
          path: |
            android/*/build/reports/
            android/*/build/test-results/
            android/*/build/outputs/apk/

  instrumentation:
    name: Instrumentation (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # API 31 covers the Android 12 location-permission behavior in PR #35.
        api: [31, 36]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The old "tools" package in this action's default was removed upstream.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run phone and Room instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            ./android/gradlew -p android --no-daemon --stacktrace --max-workers=2
            :app:connectedDebugAndroidTest :shared-logic:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-api-${{ matrix.api }}
          retention-days: 14
          path: |
            android/*/build/reports/androidTests/
            android/*/build/outputs/androidTest-results/

  wear-instrumentation:
    name: Wear OS instrumentation (API 34)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run watch instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            ./android/gradlew -p android --no-daemon --stacktrace --max-workers=2
            :wear:connectedDebugAndroidTest

      - name: Upload watch instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-wear-instrumentation-api-34
          retention-days: 14
          path: |
            android/wear/build/reports/androidTests/
            android/wear/build/outputs/androidTest-results/
